function header(){return `<div class="topbar"><span>Thoda Pahad, Har Ghar Tak</span><a href="${CATALOG}" target="_blank" rel="noopener">Browse our WhatsApp catalogue ↗</a></div><header class="header"><a href="#/" class="logo" aria-label="Pahado by Shahji home"><span class="logo-mark">⌃⌃</span><span>PAHADO<small>BY SHAHJI</small></span></a><nav class="desktop-nav" aria-label="Main navigation"><a href="#/shop">Shop</a><a href="#/story">Our story</a><a href="#/mountains">From the mountains</a><a href="${INSTAGRAM}" target="_blank" rel="noopener">Instagram ↗</a></nav><div class="nav-actions"><button class="icon-button" data-action="search" aria-label="Search products">⌕</button><button class="cart-button" data-action="cart" aria-label="Open cart">Bag <span>${cartCount()}</span></button><a class="nav-whatsapp" href="${wa('Hello Pahado by Shahji! I would like to enquire about your products.')}" target="_blank" rel="noopener">Order on WhatsApp ↗</a><button class="icon-button mobile-menu" data-action="menu" aria-label="Open menu" aria-expanded="${state.menu}">☰</button></div></header>${state.menu?`<nav class="mobile-nav"><a href="#/shop">Shop</a><a href="#/story">Our story</a><a href="#/mountains">From the mountains</a><a href="${INSTAGRAM}" target="_blank">Instagram ↗</a></nav>`:''}`}
function footer(){return `<footer><div class="footer-top"><div><span class="eyebrow">PAHADO BY SHAHJI</span><h2>Bring a little<br><em>pahad</em> home.</h2></div><p>Pahadi food enhancers, and a way to stay close to the flavours of the mountains. Explore the current collection and order directly with the team.</p><a class="button cream" href="${CATALOG}" target="_blank" rel="noopener">Explore the catalogue ↗</a></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} Pahado by Shahji · Himalayan photo: <a href="https://unsplash.com/photos/PuTSzJJ-qyU" target="_blank" rel="noopener">Rudra Gupta / Unsplash</a></span><div><a href="#/shop">Shop</a><a href="#/story">Our story</a><a href="${INSTAGRAM}" target="_blank" rel="noopener">Instagram</a><a href="${wa('Hello Pahado by Shahji! I have a question.')}" target="_blank" rel="noopener">WhatsApp</a></div></div></footer>`}
function productCard(p){return `<article class="product-card"><a href="#/products/${encodeURIComponent(p.slug)}" class="product-image">${p.image?`<img src="${esc(asset(p.image))}" alt="${esc(p.name)}" loading="lazy">`:`<span>Product image<br>coming soon</span>`}</a><div class="product-info"><div><span class="eyebrow">${esc(p.category||'Pahado')}</span><h3><a href="#/products/${encodeURIComponent(p.slug)}">${esc(p.name)}</a></h3>${p.size?`<p>${esc(p.size)}</p>`:''}</div><div class="card-prices"><span class="sale-price">${money(p.price)}</span>${p.comparePrice?`<span class="original-price">Was <del>${money(p.comparePrice)}</del></span>`:""}</div></div><button class="small-add" data-action="add" data-id="${esc(p.slug)}">Add to bag <span>＋</span></button></article>`}
const OFFER_PACKS={normal:[170,340,510],cork:[190,380,570]};
const offerMessage=(type,count)=>{const jar=type==='normal'?'Normal Glass Jar':'Cork Glass Jar';const amount=OFFER_PACKS[type][count-1];return `Hello Pahado by Shahji! I would like to enquire about the introductory offer: ${count} ${jar}${count>1?'s':''} (100 g each), shown at ₹${amount}. Please confirm the offer is still available and tell me the flavour choices.`};
function offerCard(type,title,regular){const prices=OFFER_PACKS[type];return `<article class="offer-card"><div class="offer-card-top"><span class="eyebrow">100 G · ALL THREE FLAVOURS</span><h3>${title}</h3><p>Regular single-jar price <del>${money(regular)}</del></p></div><div class="offer-price"><span>Introductory price</span><strong>${money(prices[0])}</strong><small>one jar</small></div><div class="offer-pack-list"><div><span>Pack of 2</span><strong>${money(prices[1])}</strong></div><div><span>Pack of 3</span><strong>${money(prices[2])}</strong></div></div><label class="offer-picker">Choose your pack<select data-offer-select="${type}" aria-label="Choose ${title} pack"><option value="1">1 jar — ${money(prices[0])}</option><option value="2">2 jars — ${money(prices[1])}</option><option value="3">3 jars — ${money(prices[2])}</option></select></label><a class="button whatsapp offer-order" data-offer-order="${type}" href="${wa(offerMessage(type,1))}" target="_blank" rel="noopener">Enquire on WhatsApp ↗</a></article>`}
function offerSection(){return `<section class="offers section" id="offers"><div class="section-head"><div><span class="eyebrow">INTRODUCTORY COLLECTION OFFERS</span><h2>Find your favourite format.</h2></div><p>Two 100 g jar styles for the three Pahadi namak flavours.</p></div><div class="offer-grid">${offerCard('normal','Normal glass jar',200)}${offerCard('cork','Cork glass jar',220)}</div><p class="offer-terms">The catalogue describes these as limited-time prices for the first 100 customers. Please confirm current offer eligibility, availability and flavour choice with Pahado by Shahji before ordering.</p></section>`}
function catalogSection(limit){const shown=products.slice(0,limit||products.length);return `<section id="collection" class="section collection"><div class="section-head"><div><span class="eyebrow">THE COLLECTION</span><h2>Explore Pahado</h2></div><p>Discover the current range of Pahadi food enhancers.</p></div>${shown.length?`<div class="product-grid">${shown.map(productCard).join('')}</div>`:`<div class="catalog-fallback"><div class="fallback-graphic"><span>PAHADO</span><i>✦</i><small>BY SHAHJI</small></div><div><span class="eyebrow">EXPLORE WHAT'S AVAILABLE</span><h3>Good things are taking shape.</h3><p>Our product details are being prepared for this website. The current range is available in the official WhatsApp catalogue.</p><a class="button dark" href="${CATALOG}" target="_blank" rel="noopener">View the live catalogue ↗</a></div></div>`}</section>`}
function home(){return `<main><section class="hero"><div class="hero-visual">${mountainPhoto}${products[0]?.image?`<img class="hero-photo" src="${esc(asset(products[0].image))}" alt="${esc(products[0].name)} bottle" fetchpriority="high">`:""}<div class="hero-grain"></div></div><div class="hero-content"><span class="eyebrow light">PAHADO BY SHAHJI · PAHADI FOOD ENHANCERS</span><h1>A little pahad<br>in every <em>meal.</em></h1><p>Meet flavours inspired by the mountains, made for the everyday table.</p><div class="hero-buttons"><a class="button cream" href="#/shop">Explore the collection ↗</a><a class="text-link light-link" href="#/story">Get to know us <span>↗</span></a></div></div><div class="hero-side">THODA PAHAD, HAR GHAR TAK <span>✦</span></div></section><div class="ticker"><span>PAHADI FOOD ENHANCERS</span><i>✦</i><span>THODA PAHAD, HAR GHAR TAK</span><i>✦</i><span>ORDER DIRECTLY ON WHATSAPP</span></div><section class="intro section"><div class="intro-kicker"><span class="eyebrow">A TASTE OF THE MOUNTAINS</span></div><div><h2>Something familiar.<br><em>Something wonderfully different.</em></h2><p>Food has a way of taking us somewhere. Pahado by Shahji brings a mountain inspired touch to the meals you already love.</p><a class="text-link" href="#/story">Discover our story <span>↗</span></a></div></section>${products.length?`<section class="featured section"><div class="featured-image"><img src="${esc(asset(products[0].image))}" alt="${esc(products[0].name)} bottle" loading="lazy"></div><div class="featured-copy"><span class="eyebrow">MEET THE COLLECTION</span><h2>Small bottle.<br><em>Big flavour.</em></h2><p>Start with ${esc(products[0].name)}, one of three Pahadi namak blends in the current catalogue.</p><a class="button dark" href="#/products/${esc(products[0].slug)}">Explore ${esc(products[0].name)} ↗</a></div></section>`:""}${catalogSection(4)}${offerSection()}<section class="story-panel" id="story"><div class="story-scene">${mountainPhoto}<span class="scene-label">FROM THE MOUNTAINS</span></div><div class="story-copy"><span class="eyebrow">THE PAHADO FEELING</span><h2>Rooted in the hills.<br><em>At home in your kitchen.</em></h2><p>“Thoda Pahad, Har Ghar Tak” is the heart of Pahado by Shahji. Explore the brand’s flavours and the moments behind them.</p><a class="button outline" href="#/mountains">From the mountains ↗</a></div></section><section class="social section"><div><span class="eyebrow">COME ALONG</span><h2>More of Pahado,<br><em>one reel at a time.</em></h2></div><div><p>See the latest flavours, behind the scenes moments and updates from Pahado by Shahji on Instagram.</p><a class="button dark" href="${INSTAGRAM}" target="_blank" rel="noopener">Visit Instagram ↗</a></div></section></main>`}
function shop(){const cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))];const q=state.search.trim().toLowerCase();const list=products.filter(p=>(state.filter==='All'||p.category===state.filter)&&(!q||[p.name,p.category,p.description].join(' ').toLowerCase().includes(q)));return `<main><section class="page-hero"><span class="eyebrow">THE COLLECTION</span><h1>Find your flavour.</h1><p>Discover the Pahado by Shahji range.</p></section><section class="section shop-section">${products.length?`<div class="shop-tools"><div class="filters">${cats.map(c=>`<button class="filter ${state.filter===c?'active':''}" data-action="filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><label class="search-label"><span>⌕</span><input id="search" aria-label="Search products" type="search" placeholder="Search products" value="${esc(state.search)}"></label></div>${list.length?`<div class="product-grid">${list.map(productCard).join('')}</div>`:`<div class="empty-state"><h2>No products found</h2><p>Try another search or category.</p></div>`}`:`<div class="catalog-fallback"><div class="fallback-graphic"><span>PAHADO</span><i>✦</i><small>BY SHAHJI</small></div><div><span class="eyebrow">THE CURRENT RANGE</span><h2>Explore the live catalogue.</h2><p>Product photographs, sizes and prices have not yet been supplied for this site. Browse the official WhatsApp catalogue to see what is available today.</p><a class="button dark" href="${CATALOG}" target="_blank" rel="noopener">Open WhatsApp catalogue ↗</a></div></div>`}</section>${offerSection()}</main>`}
function story(){return `<main><section class="page-hero story-hero"><span class="eyebrow">OUR STORY</span><h1>Thoda Pahad,<br><em>Har Ghar Tak.</em></h1><p>A simple idea: make room for a little mountain flavour at every table.</p></section><section class="story-panel"> <div class="story-scene">${mountainPhoto}</div><div class="story-copy"><span class="eyebrow">MEET PAHADO</span><h2>Mountain feeling.<br>Everyday meals.</h2><p>Pahado by Shahji calls its range “Pahadi Food Enhancer.” Its Instagram shares flavours, work in progress and behind the scenes moments. We’re bringing that same warmth here.</p><a class="button outline" href="${INSTAGRAM}" target="_blank" rel="noopener">See the brand on Instagram ↗</a></div></section><section class="section social"><div><span class="eyebrow">EXPLORE MORE</span><h2>Curious about<br><em>the flavours?</em></h2></div><div><p>Visit the official catalogue for the current range, then message the team directly with your questions.</p><a class="button dark" href="${CATALOG}" target="_blank" rel="noopener">Browse the catalogue ↗</a></div></section></main>`}
function productPage(slug){const p=products.find(x=>x.slug===slug);if(!p)return `<main class="not-found"><span class="eyebrow">PRODUCT NOT FOUND</span><h1>Let's find your way back.</h1><a class="button dark" href="#/shop">Back to shop</a></main>`;return `<main><div class="breadcrumbs"><a href="#/">Home</a> / <a href="#/shop">Shop</a> / ${esc(p.name)}</div><section class="product-detail"><div class="detail-image">${p.image?`<img src="${esc(asset(p.image))}" alt="Front view of ${esc(p.name)}">`:'<span>Product image coming soon</span>'}<small>Front image preview</small></div><div class="detail-copy"><span class="eyebrow">${esc(p.category||'PAHADO')}</span><h1>${esc(p.name)}</h1>${p.size?`<p class="size">${esc(p.size)}</p>`:''}<p class="price"><span class="sale-price">${money(p.price)}</span> ${p.comparePrice?`<span class="original-price">Was <del>${money(p.comparePrice)}</del></span>`:""}</p>${p.shortDescription?`<p>${esc(p.shortDescription)}</p>`:''}<div class="detail-actions"><label>Quantity <input id="qty" type="number" min="1" max="99" value="1"></label><button class="button dark" data-action="add" data-id="${esc(p.slug)}">Add to bag</button></div><a class="button whatsapp" href="${wa('Hello Pahado by Shahji! I would like to order '+p.name+'.')}" target="_blank" rel="noopener">Enquire on WhatsApp ↗</a><p class="fine">Final price and availability can be confirmed with the Pahado team.</p>${p.description?`<details open><summary>About this product</summary><p>${esc(p.description)}</p></details>`:''}${p.ingredients?`<details><summary>Ingredients</summary><p>${esc(p.ingredients)}</p></details>`:''}${p.origin?`<details><summary>Origin</summary><p>${esc(p.origin)}</p></details>`:''}${p.howToUse?`<details><summary>How to use</summary><p>${esc(p.howToUse)}</p></details>`:''}${p.storage?`<details><summary>Storage</summary><p>${esc(p.storage)}</p></details>`:''}</div></section>${offerSection()}${products.length>1?`<section class="section"><div class="section-head"><h2>You may also like</h2></div><div class="product-grid">${products.filter(x=>x.slug!==p.slug).slice(0,3).map(productCard).join('')}</div></section>`:''}</main>`}
function cart(){const lines=cartLines();const total=lines.every(x=>typeof x.product.price==='number')?lines.reduce((a,x)=>a+x.product.price*x.qty,0):null;const msg=lines.length?'Hello Pahado by Shahji! I would like to enquire about:\n'+lines.map(x=>`• ${x.product.name}${x.product.size?' ('+x.product.size+')':''} × ${x.qty}`).join('\n'):'Hello Pahado by Shahji! I would like to enquire about your products.';return `<div class="scrim" data-action="close-cart"></div><aside class="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping bag"><div class="drawer-head"><h2>Your bag <span>(${cartCount()})</span></h2><button class="icon-button" data-action="close-cart" aria-label="Close bag">×</button></div>${lines.length?`<div class="cart-lines">${lines.map(({product:p,qty})=>`<div class="cart-line"><div class="cart-thumb">${p.image?`<img src="${esc(asset(p.image))}" alt="">`:'✦'}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.size||'')}</small><span>${money(p.price)}</span><div class="qty-controls"><button data-action="decrease" data-id="${esc(p.slug)}" aria-label="Decrease ${esc(p.name)} quantity">−</button>${qty}<button data-action="increase" data-id="${esc(p.slug)}" aria-label="Increase ${esc(p.name)} quantity">+</button></div></div></div>`).join('')}</div><div class="drawer-bottom">${total!==null?`<div class="subtotal"><span>Estimated subtotal</span><strong>${money(total)}</strong></div>`:''}<p>Confirm prices, availability and delivery directly with the team.</p><a class="button whatsapp" href="${wa(msg)}" target="_blank" rel="noopener">Send enquiry on WhatsApp ↗</a></div>`:`<div class="cart-empty"><div>✦</div><h3>Your bag is waiting.</h3><p>Explore the collection or browse the current products on WhatsApp.</p><a class="button dark" href="#/shop" data-action="close-cart">Explore products</a></div>`}</aside>`}
function render(){const path=decodeURI(location.hash.slice(1)||'/');const main=path==='/shop'?shop():path==='/story'||path==='/mountains'?story():path.startsWith('/products/')?productPage(path.split('/')[2]):home();app.innerHTML=header()+main+footer()+(state.cartOpen?cart():'');document.body.classList.toggle('drawer-open',state.cartOpen);document.title=(path==='/shop'?'Shop | ':path==='/story'?'Our story | ':path.startsWith('/products/')?((products.find(p=>p.slug===path.split('/')[2])?.name||'Product')+' | '):'')+'Pahado by Shahji';}
window.addEventListener('hashchange',()=>{state.menu=false;state.cartOpen=false;render();window.scrollTo({top:0,behavior:"instant"})});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;if(a==='menu'){state.menu=!state.menu;render()}if(a==='cart'){state.cartOpen=true;render()}if(a==='close-cart'){state.cartOpen=false;render()}if(a==='add'){const qty=Number(document.querySelector('#qty')?.value||1);state.cart[id]=(state.cart[id]||0)+Math.max(1,Math.min(99,qty));persist();state.cartOpen=true;render()}if(a==='increase'||a==='decrease'){state.cart[id]=Math.max(0,(state.cart[id]||0)+(a==='increase'?1:-1));if(!state.cart[id])delete state.cart[id];persist();render()}if(a==='filter'){state.filter=el.dataset.value;render()}if(a==='search'){location.hash='#/shop';setTimeout(()=>document.querySelector('#search')?.focus(),0)}});
document.addEventListener('change',e=>{const select=e.target.closest('[data-offer-select]');if(!select)return;const type=select.dataset.offerSelect;const count=Number(select.value);const link=select.closest('.offer-card')?.querySelector('[data-offer-order]');if(link&&OFFER_PACKS[type]?.[count-1])link.href=wa(offerMessage(type,count))});
document.addEventListener('input',e=>{if(e.target.id==='search'){const position=e.target.selectionStart;state.search=e.target.value;const section=document.querySelector('.shop-section');if(section){const cats=['All',...new Set(products.map(p=>p.category).filter(Boolean))];const q=state.search.trim().toLowerCase();const list=products.filter(p=>(state.filter==='All'||p.category===state.filter)&&(!q||[p.name,p.category,p.description].join(' ').toLowerCase().includes(q)));const grid=section.querySelector('.product-grid,.empty-state');if(grid)grid.outerHTML=list.length?`<div class="product-grid">${list.map(productCard).join('')}</div>`:`<div class="empty-state"><h2>No products found</h2><p>Try another search or category.</p></div>`}}});
render();
</script></body></html>
